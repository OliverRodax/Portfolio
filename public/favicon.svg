<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- The tab bar has its own light/dark theme, so the mark inverts with it:
       ink on paper in a light bar, paper on ink in a dark one. -->
  <style>
    .bg { fill: #1c1b18 }
    .fg { fill: #fbfaf7 }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #eeece5 }
      .fg { fill: #171613 }
    }
  </style>
  <rect class="bg" width="64" height="64" rx="8"/>
  <text class="fg" x="31.5" y="43" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif" font-size="29"
        font-weight="600" letter-spacing="1">OR</text>
</svg>
